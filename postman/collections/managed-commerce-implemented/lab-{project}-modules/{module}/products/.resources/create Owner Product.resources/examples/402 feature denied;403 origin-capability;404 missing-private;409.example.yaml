      value: application/json
  pathVariables:
    - key: project
      value: 34c9f942-d901-6272-1761-67c2ee5e8e3a
      disabled: false
      description: "(Required) "
    - key: module
      value: 34c9f942-d901-6272-1761-67c2ee5e8e3a
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "idempotency_key": "7f30708d-832f-df94-00cc-68dca4258fd1",
        "sku": "ShALfG-EfxqRoLnNZe5-Ka",
        "title": "string",
        "price_satang": 45198790,
        "description": "string",
        "active": false
      }
