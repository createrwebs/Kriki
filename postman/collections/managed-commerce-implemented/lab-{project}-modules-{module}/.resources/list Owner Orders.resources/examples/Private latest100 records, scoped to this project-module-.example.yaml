$kind: http-example
name: Private latest100 records, scoped to this project/module.
request:
  url: "{{baseUrl}}/lab/:project/modules/:module/orders?status=pending_review"
  method: GET
  headers:
    - key: laravel_session
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  queryParams:
    status: pending_review
  pathVariables:
    - key: project
      value: 1b92dfdd-62f5-daab-74f6-5c8599acb5ec
      disabled: false
      description: "(Required) "
    - key: module
      value: 1b92dfdd-62f5-daab-74f6-5c8599acb5ec
      disabled: false
      description: "(Required) "
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "items": [],
        "limit": {}
      }
order: 1000
