$kind: http-example
name: Private no-store signed image URL.
request:
  url: "{{baseUrl}}/lab/:project/modules/:module/payment-attempts/:attempt/image"
  method: GET
  headers:
    - key: laravel_session
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: project
      value: 42f952c6-86e7-67ab-8842-f8dac3a02326
      disabled: false
      description: "(Required) "
    - key: module
      value: 42f952c6-86e7-67ab-8842-f8dac3a02326
      disabled: false
      description: "(Required) "
    - key: attempt
      value: 42f952c6-86e7-67ab-8842-f8dac3a02326
      disabled: false
      description: "(Required) "
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "url": "https://lsXXGGsjcbhPHSXbjh.uzUZ2lEUHLpGzHzDHHkVov0lYtrFehqt1Ak0",
        "expires_at": "1948-07-19T02:04:23.773Z"
      }
order: 1000
