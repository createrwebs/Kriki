$kind: http-request
description: Maximum16KiB JSON. Requires an explicitly confirmed quote_uuid and matching cart. Expired, consumed or changed product/payment versions return409; obtain and confirm a fresh quote. Caller totals/recipient/status are rejected. Same UUID+normalized payload replays an accepted snapshot even after quote expiry/disable while guest capability remains valid; changed payload409. A quote is consumed atomically by one creation key. Rate10/min/IP/module and100/min/module. Preserve exact payload/key on ambiguous transport failures.
url: "{{baseUrl}}/api/lab-widgets/:module/orders"
method: POST
headers:
  - key: Origin
    value: "{{publicationOrigin}}"
    disabled: false
    description: (Required) Exact authorized publication origin. CORS permits Content-Type/Accept/X-Krikkit-Order-Token without credentials.
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
