$kind: http-example
name: Immutable review and derived order state.
request:
  url: "{{baseUrl}}/lab/:project/modules/:module/payment-attempts/:attempt/review"
  method: POST
  headers:
    - key: laravel_session
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-CSRF-TOKEN
      value: string
      disabled: false
      description: "(Required) "
    - key: Accept
      value: application/json
  pathVariables:
    - key: project
      value: 42f952c6-86e7-67ab-8842-f8dac3a02326
      disabled: false
      description: "(Required) "
    - key: module
      value: 42f952c6-86e7-67ab-8842-f8dac3a02326
      disabled: false
      description: "(Required) "
    - key: attempt
      value: 42f952c6-86e7-67ab-8842-f8dac3a02326
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "expected_version": 2001,
        "decision": "accepted",
        "reason": "string",
        "bank_verified": true
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "review": {}
      }
order: 1000
