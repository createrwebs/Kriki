$kind: http-example
name: Authenticated historical proof image; URL grants no bearer access.
request:
  url: "{{baseUrl}}/lab/:project/modules/:module/payment-attempts/:attempt/legacy-image"
  method: GET
  headers:
    - key: laravel_session
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: image/png
  pathVariables:
    - key: project
      value: 34c9f942-d901-6272-1761-67c2ee5e8e3a
      disabled: false
      description: "(Required) "
    - key: module
      value: 34c9f942-d901-6272-1761-67c2ee5e8e3a
      disabled: false
      description: "(Required) "
    - key: attempt
      value: 34c9f942-d901-6272-1761-67c2ee5e8e3a
      disabled: false
      description: "(Required) "
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: image/png
  body:
    type: text
    content: string
order: 1000
