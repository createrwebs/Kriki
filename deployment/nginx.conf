user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 128M;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root /var/www/html;
        index index.php index.html;

        # -----------------------------------------------------------
        # 1. Krikkit AI Website Builder (/lab, /builder, /api/lab)
        # -----------------------------------------------------------
        location ~ ^/(lab|builder|api/lab|projects) {
            proxy_pass http://krikkit:8892;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300;
        }

        location /build/ {
            proxy_pass http://krikkit:8892;
            proxy_set_header Host $host;
        }

        # -----------------------------------------------------------
        # 2. WHMCS Billing (/billing/)
        # -----------------------------------------------------------
        location /billing/ {
            alias /var/www/whmcs/;
            try_files $uri $uri/ @whmcs_rewrite;

            location ~ \.php$ {
                include fastcgi_params;
                fastcgi_split_path_info ^(/billing)(/.*)$;
                fastcgi_param SCRIPT_FILENAME /var/www/whmcs$fastcgi_path_info;
                fastcgi_param PATH_INFO $fastcgi_path_info;
                fastcgi_param SCRIPT_NAME /billing$fastcgi_script_name;
                fastcgi_pass whmcs:9000;
                fastcgi_index index.php;
                fastcgi_read_timeout 300;
                fastcgi_buffer_size 128k;
                fastcgi_buffers 4 256k;
                fastcgi_busy_buffers_size 256k;
            }
        }

        location @whmcs_rewrite {
            rewrite ^/billing/(.*)$ /billing/index.php?rp=/$1 last;
        }

        # Static assets for WHMCS
        location ~ ^/billing/(templates|assets|modules|resources)/(.*)$ {
            alias /var/www/whmcs/$1/$2;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # -----------------------------------------------------------
        # 3. WordPress (Root /)
        # -----------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass wordpress:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_read_timeout 300;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
        }

        # WordPress Static Cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires max;
            log_not_found off;
        }
    }
}
